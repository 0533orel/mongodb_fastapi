# ========= Deployment: FastAPI (Mongo) =========
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-loader-api
  namespace: 0533orel-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-loader-api
  template:
    metadata:
      labels:
        app: data-loader-api
    spec:
      containers:
        - name: api
          image: 0533orel/data-loader-api:mongodb   # עדכן לטאג שלך
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          envFrom:
            - secretRef:
                name: mongodb-secret   # מכאן יגיעו MONGODB_USERNAME/PASSWORD/DATABASE
          env:
            - name: MONGO_HOST
              value: "mongodb"        # שם ה-Service של MongoDB
            - name: MONGO_PORT
              value: "27017"
            - name: MONGO_DB
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGODB_DATABASE
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGODB_USERNAME
            - name: MONGO_PASS
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGODB_PASSWORD
            # אופציונלי: לקבע authSource
            - name: MONGO_AUTH_SOURCE
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGODB_DATABASE
            # אופציונלי: שם הקולקשן
            - name: MONGO_COLLECTION
              value: "people"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 512Mi
---
# ========= Service: FastAPI =========
apiVersion: v1
kind: Service
metadata:
  name: data-loader-api
  namespace: 0533orel-dev
spec:
  selector:
    app: data-loader-api
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
  type: ClusterIP
---
# ========= (Optional) Route: חשיפה החוצה =========
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: data-loader-api
  namespace: 0533orel-dev
spec:
  to:
    kind: Service
    name: data-loader-api
  port:
    targetPort: http
  tls:
    termination: edge
